<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Surveillance Camera Room</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      touch-action: none;
      font-family: system-ui, sans-serif;
    }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    #portraitViewport {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      overflow: hidden;
      background: black;
    }

    #roomVideo {
      position: absolute;
      height: 100%;
      width: auto;
      top: 0;
      left: 0;
      user-select: none;
      pointer-events: none;
      transform: translateX(0) scale(1);
      transform-origin: center center;
      will-change: transform, filter;
    }

    #cameraButton {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 5px solid white;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      padding: 0;
    }

    #cameraButton::after {
      content: "";
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: white;
      display: block;
    }

    #cameraButton:active {
      transform: translateX(-50%) scale(0.92);
    }

    #blackFlash {
      position: absolute;
      inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }

    .snapshotFlash {
      animation: flashBlack 420ms ease-out;
    }

    .snapshotVideo {
      animation: snapZoomBlur 520ms ease-out;
    }

    @keyframes flashBlack {
      0% { opacity: 0; }
      18% { opacity: 1; }
      42% { opacity: 0.85; }
      100% { opacity: 0; }
    }

    @keyframes snapZoomBlur {
      0% {
        filter: blur(0px);
      }
      15% {
        filter: blur(7px);
      }
      35% {
        filter: blur(4px);
      }
      100% {
        filter: blur(0px);
      }
    }
  </style>
</head>

<body>
  <div id="game">
    <div id="portraitViewport">
      <video
        id="roomVideo"
        src="room.mp4"
        autoplay
        muted
        loop
        playsinline
      ></video>

      <div id="blackFlash"></div>

      <button id="cameraButton" aria-label="Take photo"></button>
    </div>
  </div>

  <script>
    const viewport = document.getElementById("portraitViewport");
    const video = document.getElementById("roomVideo");
    const flash = document.getElementById("blackFlash");
    const cameraButton = document.getElementById("cameraButton");

    let offsetX = 0;
    let minOffset = 0;
    let direction = -1; // -1 = moving left, 1 = moving right
    let speed = 22; // pixels per second
    let pausedUntil = 0;

    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerDownTime = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function updateLimits() {
      const viewportWidth = viewport.clientWidth;
      const videoWidth = video.videoWidth * (viewport.clientHeight / video.videoHeight);

      minOffset = Math.min(0, viewportWidth - videoWidth);
      offsetX = clamp(offsetX, minOffset, 0);
      applyCameraTransform();
    }

    function applyCameraTransform(extraScale = 1) {
      video.style.transform = `translateX(${offsetX}px) scale(${extraScale})`;
    }

    video.addEventListener("loadedmetadata", () => {
      updateLimits();
      offsetX = minOffset / 2;
      applyCameraTransform();
    });

    window.addEventListener("resize", updateLimits);

    let lastTime = performance.now();

    function animateCamera(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      if (now >= pausedUntil) {
        offsetX += direction * speed * delta;

        if (offsetX <= minOffset) {
          offsetX = minOffset;
          direction = 1;
          pausedUntil = now + 2000;
        }

        if (offsetX >= 0) {
          offsetX = 0;
          direction = -1;
          pausedUntil = now + 2000;
        }

        applyCameraTransform();
      }

      requestAnimationFrame(animateCamera);
    }

    requestAnimationFrame(animateCamera);

    viewport.addEventListener("pointerdown", (e) => {
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      pointerDownTime = performance.now();
    });

    viewport.addEventListener("pointerup", (e) => {
      const dx = e.clientX - pointerDownX;
      const dy = e.clientY - pointerDownY;
      const dt = performance.now() - pointerDownTime;

      const isSwipe = Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) && dt < 700;

      if (isSwipe) {
        if (dx < 0) {
          direction = -1;
        } else {
          direction = 1;
        }

        pausedUntil = 0;
      }
    });

    function playShutterSound() {
      const audio = new AudioContext();

      const osc = audio.createOscillator();
      const gain = audio.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(900, audio.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, audio.currentTime + 0.08);

      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start();
      osc.stop(audio.currentTime + 0.13);
    }

    function takeSnapshot() {
      playShutterSound();

      flash.classList.remove("snapshotFlash");
      video.classList.remove("snapshotVideo");

      void flash.offsetWidth;
      void video.offsetWidth;

      flash.classList.add("snapshotFlash");
      video.classList.add("snapshotVideo");

      let start = performance.now();

      function zoomPulse(now) {
        const t = now - start;

        if (t < 110) {
          applyCameraTransform(1.035);
          requestAnimationFrame(zoomPulse);
        } else if (t < 260) {
          applyCameraTransform(0.985);
          requestAnimationFrame(zoomPulse);
        } else if (t < 520) {
          applyCameraTransform(1);
          requestAnimationFrame(zoomPulse);
        } else {
          applyCameraTransform(1);
        }
      }

      requestAnimationFrame(zoomPulse);
    }

    cameraButton.addEventListener("click", takeSnapshot);
  </script>
</body>
</html>
