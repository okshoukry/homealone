<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Room Word Hunt</title>
  <style>
    :root {
      --tarantino-yellow: #f6d20a;
      --letter-beige: #eee3cb;
      --ink: #090909;
      --letter-parallax: .78;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { cursor: grab; }
    body.grabbing { cursor: grabbing; }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #portraitViewport {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8);
      isolation: isolate;
    }

    #roomVideo {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #letterWorld {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #roomVideo {
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    #letterWorld {
      z-index: 2;
      pointer-events: none;
    }

    .letter-drop {
      position: absolute;
      top: 0;
      width: clamp(34px, 5.4vh, 52px);
      height: var(--thread-length, 320px);
      transform: translateX(-50%) translateY(calc(-1 * var(--thread-length, 320px) - 70px));
      pointer-events: none;
      animation: dropIntoRoom var(--drop-duration, 680ms) cubic-bezier(.18,.84,.28,1.06) forwards;
      animation-delay: var(--drop-delay, 0ms);
      will-change: transform, opacity;
    }

    .hanging-letter {
      position: relative;
      width: 100%;
      height: 100%;
      transform: none;
      transform-origin: 50% 0;
      pointer-events: none;
    }

    .hanging-letter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: calc(100% - clamp(34px, 5.4vh, 52px) / 2);
      background: rgba(225, 218, 202, .78);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .letter-bob {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: clamp(34px, 5.4vh, 52px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      animation: gentleBob var(--bob-duration, 5.8s) ease-in-out infinite alternate;
      animation-delay: var(--bob-delay, 0s);
      will-change: transform;
      pointer-events: none;
    }

    .letter-tile {
      position: absolute;
      inset: 0;
      width: clamp(34px, 5.4vh, 52px);
      aspect-ratio: 1;
      border: 0;
      border-radius: 2px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--letter-beige);
      font-size: clamp(20px, 3.2vh, 31px);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: none;
      transform: scale(1);
      transition:
        transform 220ms cubic-bezier(.2,.8,.2,1),
        opacity 180ms ease,
        background-color 180ms ease;
      filter: blur(.65px);
      will-change: transform, filter;
    }

    .letter-tile:hover,
    .letter-tile:focus-visible {
      transform: scale(1.05);
      outline: none;
    }

    .letter-tile.selected {
      pointer-events: none;
    }

    /* A correct tile is yanked upward with its full thread, out of view. */
    .letter-drop.collected {
      pointer-events: none;
      animation: collectLetter 240ms cubic-bezier(.55, 0, 1, .45) forwards;
      animation-delay: 0ms;
    }

    .letter-drop.collected .letter-tile {
      pointer-events: none;
    }

    .letter-tile.wrong { animation: wrongTap 220ms ease; }
    .letter-tile.clearing { animation: tileOut 230ms ease forwards; }

    #hud {
      position: absolute;
      z-index: 10;
      left: max(8%, calc(env(safe-area-inset-left) + 10px));
      bottom: max(13%, calc(env(safe-area-inset-bottom) + 14px));
      width: min(82%, 430px);
      padding: 0;
      color: #d9f3ce;
      background: transparent;
      border: 0;
      border-radius: 0;
      font-family: "OCR A Std", "OCR A Extended", "Lucida Console", Monaco, monospace;
      text-align: left;
      pointer-events: none;
      text-shadow: 0 0 2px rgba(204, 255, 190, .65);
      backdrop-filter: none;
    }

    #hud::before {
      content: "CAM 01  /  TARGET";
      display: block;
      margin-bottom: 5px;
      color: rgba(217, 243, 206, .78);
      font-size: clamp(20px, 2.8vh, 26px);
      line-height: 1;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    #wordDisplay {
      min-height: 30px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .hud-letter {
      min-width: 16px;
      color: rgba(216, 247, 209, .48);
      font-size: clamp(26px, 3.7vh, 34px);
      font-weight: 400;
      text-transform: uppercase;
      border: 0;
      line-height: 1.1;
    }

    .hud-letter.found {
      color: #d8f7d1;
      border: 0;
      animation: hudPop 160ms ease both;
    }

    #status {
      margin-top: 7px;
      color: rgba(216, 247, 209, .64);
      font-size: clamp(18px, 2.5vh, 22px);
      font-weight: 400;
      letter-spacing: .03em;
      text-transform: uppercase;
      text-shadow: none;
      line-height: 1.2;
    }

    #message {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--tarantino-yellow);
      font-size: clamp(34px, 6vh, 62px);
      font-weight: 1000;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: 0 5px 0 #000, 0 10px 24px rgba(0,0,0,.65);
      opacity: 0;
      transform: scale(.82);
      pointer-events: none;
    }

    #message.show { animation: messageFlash 620ms ease both; }

    @keyframes dropIntoRoom {
      0% { opacity: 0; transform: translateX(-50%) translateY(calc(-1 * var(--thread-length, 320px) - 70px)); }
      18% { opacity: 1; }
      78% { transform: translateX(-50%) translateY(10px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes gentleBob {
      from { transform: translateX(-50%) translateY(-4px); }
      to { transform: translateX(-50%) translateY(5px); }
    }

    @keyframes collectLetter {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      28% {
        transform: translateX(-50%) translateY(-18px);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(calc(-1 * var(--thread-length, 320px) - 90px));
      }
    }

    @keyframes tileOut {
      to { opacity: 0; transform: scale(1.35) rotate(6deg); }
    }

    @keyframes wrongTap {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(.94); }
      72% { transform: scale(1.04); }
    }

    @keyframes hudPop {
      from { transform: scale(.68); }
      to { transform: scale(1); }
    }

    @keyframes messageFlash {
      0% { opacity: 0; transform: scale(.82); }
      25%, 68% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="portraitViewport">
      <video id="roomVideo" src="room.mp4" autoplay muted loop playsinline></video>
      <div id="letterWorld" aria-label="Scattered word letters"></div>

      <div id="hud">
        <div id="wordDisplay" aria-live="polite"></div>
        <div id="status">Loading words…</div>
      </div>

      <div id="message">Found!</div>
    </div>
  </div>

  <script>
    const WORDS_FILE = "words.txt";
    const FALLBACK_WORDS = ["cinema", "camera", "yellow", "revenge", "dialogue"];

    const viewport = document.getElementById("portraitViewport");
    const video = document.getElementById("roomVideo");
    const letterWorld = document.getElementById("letterWorld");
    const wordDisplay = document.getElementById("wordDisplay");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const body = document.body;

    let words = [];
    let wordIndex = 0;
    let currentWord = "";
    let selectedCount = 0;
    let tiles = [];
    let hangers = [];
    let drops = [];
    let selectionHistory = [];

    let isDragging = false;
    let movedDuringDrag = false;
    let startX = 0;
    let startOffset = 0;
    let offsetX = 0;
    let minOffset = 0;
    let renderedVideoWidth = 0;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    async function loadWords() {
      try {
        const response = await fetch(WORDS_FILE, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const text = await response.text();
        words = text
          .split(/\r?\n/)
          .map(line => line.trim().toLowerCase())
          .filter(line => line && !line.startsWith("#"))
          .map(line => line.replace(/[^a-z0-9]/g, ""))
          .filter(Boolean);

        if (!words.length) throw new Error("No valid words found");
      } catch (error) {
        console.warn("Could not load words.txt; using built-in sample words.", error);
        words = [...FALLBACK_WORDS];
        status.textContent = "Using built-in words (serve locally to load words.txt)";
      }

      shuffleArray(words);
      startWord(0);
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function updateLimits() {
      if (!video.videoWidth || !video.videoHeight) return;

      renderedVideoWidth = video.videoWidth * (viewport.clientHeight / video.videoHeight);
      minOffset = Math.min(0, viewport.clientWidth - renderedVideoWidth);
      offsetX = clamp(offsetX, minOffset, 0);

      letterWorld.style.width = `${renderedVideoWidth}px`;
      letterWorld.style.height = `${viewport.clientHeight}px`;
      applyWorldOffset();
    }

    function applyWorldOffset() {
      video.style.transform = `translateX(${offsetX}px)`;

      // The letters occupy the whole panoramic room, but move at a different
      // speed to the video to create a separate foreground parallax layer.
      const parallaxFactor = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--letter-parallax")
      ) || .78;
      letterWorld.style.transform = `translateX(${offsetX * parallaxFactor}px)`;
    }

    function startWord(index) {
      wordIndex = index % words.length;
      currentWord = words[wordIndex];
      selectedCount = 0;
      selectionHistory = [];
      createHudWord();
      createScatteredLetters();
      status.textContent = `Word ${wordIndex + 1} of ${words.length}`;
    }

    function createHudWord() {
      wordDisplay.replaceChildren();
      [...currentWord].forEach((letter, index) => {
        const slot = document.createElement("span");
        slot.className = "hud-letter";
        slot.dataset.index = index;
        slot.textContent = "·";
        wordDisplay.appendChild(slot);
      });
    }

    function createScatteredLetters() {
      letterWorld.replaceChildren();
      tiles = [];
      hangers = [];
      drops = [];

      const positions = generatePositions(currentWord.length);
      [...currentWord].forEach((letter, index) => {
        const drop = document.createElement("div");
        drop.className = "letter-drop";
        drop.style.left = `${positions[index].x}px`;
        drop.style.setProperty("--thread-length", `${positions[index].y}px`);
        drop.style.setProperty("--drop-delay", `${index * 75 + Math.random() * 90}ms`);
        drop.style.setProperty("--drop-duration", `${620 + Math.random() * 180}ms`);

        const hanger = document.createElement("div");
        hanger.className = "hanging-letter";

        const bob = document.createElement("div");
        bob.className = "letter-bob";
        bob.style.setProperty("--bob-duration", `${4.8 + Math.random() * 2.4}s`);
        bob.style.setProperty("--bob-delay", `${-Math.random() * 6}s`);

        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "letter-tile";
        tile.textContent = letter;
        tile.dataset.index = index;
        tile.dataset.letter = letter;
        tile.setAttribute("aria-label", `Letter ${letter}`);

        tile.addEventListener("pointerdown", event => event.stopPropagation());
        tile.addEventListener("click", event => {
          event.stopPropagation();
          selectLetter(letter, index, tile);
        });

        bob.appendChild(tile);
        hanger.appendChild(bob);
        drop.appendChild(hanger);
        letterWorld.appendChild(drop);
        tiles.push(tile);
        hangers.push(hanger);
        drops.push(drop);
      });
    }

    function generatePositions(count) {
      const viewportWidth = viewport.clientWidth;
      const height = viewport.clientHeight;
      const tileSize = clamp(height * .054, 34, 52);
      const parallaxFactor = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--letter-parallax")
      ) || .78;

      // Because the letter layer pans more slowly than the video, this is the
      // complete horizontal area the player can reveal while dragging from one
      // end of the room to the other.
      const cameraTravel = Math.abs(minOffset);
      const reachableWidth = viewportWidth + cameraTravel * parallaxFactor;

      // Keep each tile fully visible when its section of the room is reached.
      // The extra margin allows for pendulum swing.
      const marginX = Math.max(54, tileSize * 1.35);
      const minX = marginX;
      const maxX = Math.max(minX, reachableWidth - marginX);

      // Every tile must remain entirely within the upper half of the screen.
      // y is the bottom edge of the square because the tile sits at the
      // bottom of its hanging container. A small safety margin also allows
      // for the pendulum arc without crossing the halfway line.
      const topSafe = Math.max(132, height * .17);
      const halfScreenLimit = height * .5;
      const swingSafety = Math.max(14, tileSize * .35);
      const minY = Math.min(halfScreenLimit - swingSafety, topSafe + tileSize);
      const maxY = Math.max(minY, halfScreenLimit - swingSafety);

      // Spread the letters across the entire room panorama. Each letter gets
      // its own broad horizontal region, so some appear only after panning.
      const positions = Array.from({ length: count }, (_, index) => {
        const laneStart = minX + (maxX - minX) * (index / count);
        const laneEnd = minX + (maxX - minX) * ((index + 1) / count);
        const lanePadding = Math.min(22, Math.max(4, (laneEnd - laneStart) * .12));
        const x = count === 1
          ? (minX + maxX) / 2
          : laneStart + lanePadding + Math.random() * Math.max(1, laneEnd - laneStart - lanePadding * 2);

        return {
          x: clamp(x, minX, maxX),
          y: minY + Math.random() * Math.max(1, maxY - minY)
        };
      });

      // Randomise which letter occupies each horizontal section so the answer
      // is not laid out in reading order from left to right.
      for (let i = positions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [positions[i], positions[j]] = [positions[j], positions[i]];
      }

      return positions;
    }

    function selectLetter(letter, tileIndex, tile) {
      const expectedLetter = currentWord[selectedCount];
      if (letter !== expectedLetter || tile.classList.contains("selected")) {
        tile.classList.remove("wrong");
        void tile.offsetWidth;
        tile.classList.add("wrong");
        return;
      }

      tile.classList.add("selected");
      const drop = drops[tileIndex];
      drop.classList.remove("collected");
      void drop.offsetWidth;
      drop.classList.add("collected");

      selectionHistory.push(tileIndex);
      const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      hudSlot.textContent = expectedLetter;
      hudSlot.classList.add("found");
      selectedCount++;

      if (selectedCount === currentWord.length) completeWord();
    }

    function undoLastLetter() {
      if (selectedCount <= 0 || !selectionHistory.length) return;
      selectedCount--;

      const tileIndex = selectionHistory.pop();
      const tile = tiles[tileIndex];
      const drop = drops[tileIndex];
      drop.classList.remove("collected");
      tile.classList.remove("selected");

      const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      hudSlot.textContent = "·";
      hudSlot.classList.remove("found");
    }

    function completeWord() {
      status.textContent = `Completed: ${currentWord.toUpperCase()}`;
      message.classList.remove("show");
      void message.offsetWidth;
      message.classList.add("show");
      tiles.forEach((tile, index) => {
        if (!drops[index].classList.contains("collected")) {
          tile.style.animationDelay = `${index * 18}ms`;
          tile.classList.add("clearing");
        }
      });

      window.setTimeout(() => {
        const nextIndex = wordIndex + 1;
        if (nextIndex >= words.length) shuffleArray(words);
        startWord(nextIndex >= words.length ? 0 : nextIndex);
      }, 650);
    }

    function pointerDown(event) {
      if (event.button !== undefined && event.button !== 0) return;
      isDragging = true;
      movedDuringDrag = false;
      startX = event.clientX;
      startOffset = offsetX;
      body.classList.add("grabbing");
      viewport.setPointerCapture(event.pointerId);
    }

    function pointerMove(event) {
      if (!isDragging) return;
      const dragDistance = event.clientX - startX;
      if (Math.abs(dragDistance) > 3) movedDuringDrag = true;
      offsetX = clamp(startOffset + dragDistance, minOffset, 0);
      applyWorldOffset();
    }

    function pointerUp(event) {
      isDragging = false;
      body.classList.remove("grabbing");
      try { viewport.releasePointerCapture(event.pointerId); } catch {}
    }

    video.addEventListener("loadedmetadata", () => {
      updateLimits();
      offsetX = minOffset / 2;
      applyWorldOffset();
      if (currentWord) createScatteredLetters();
    });

    window.addEventListener("resize", () => {
      updateLimits();
      if (currentWord) createScatteredLetters();
    });

    window.addEventListener("keydown", event => {
      if (event.key === "Backspace" || event.key === "Back") {
        event.preventDefault();
        undoLastLetter();
      }
    });

    viewport.addEventListener("pointerdown", pointerDown);
    viewport.addEventListener("pointermove", pointerMove);
    viewport.addEventListener("pointerup", pointerUp);
    viewport.addEventListener("pointercancel", pointerUp);

    loadWords();
  </script>
</body>
</html>
