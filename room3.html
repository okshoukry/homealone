<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Room Word Hunt</title>
  <style>
    :root {
      --tarantino-yellow: #f6d20a;
      --ink: #090909;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { cursor: grab; }
    body.grabbing { cursor: grabbing; }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #portraitViewport {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8);
      isolation: isolate;
    }

    #roomVideo,
    #letterWorld {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #roomVideo {
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    #letterWorld {
      z-index: 2;
      pointer-events: none;
    }

    .letter-tile {
      position: absolute;
      width: clamp(34px, 5.4vh, 52px);
      aspect-ratio: 1;
      border: 2px solid rgba(0, 0, 0, .88);
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--tarantino-yellow);
      font-size: clamp(20px, 3.2vh, 31px);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
      pointer-events: auto;
      box-shadow:
        0 3px 0 rgba(0, 0, 0, .8),
        0 8px 18px rgba(0, 0, 0, .35);
      transform: translate(-50%, -50%) scale(1);
      transition:
        transform 160ms cubic-bezier(.2,.8,.2,1),
        opacity 160ms ease,
        filter 160ms ease;
      animation: tileIn 260ms cubic-bezier(.18,.9,.25,1.2) both;
    }

    .letter-tile:hover,
    .letter-tile:focus-visible {
      transform: translate(-50%, -50%) scale(1.05);
      outline: none;
      filter: brightness(1.08);
    }

    .letter-tile.selected {
      opacity: .24;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.86);
    }

    .letter-tile.wrong { animation: wrongTap 220ms ease; }
    .letter-tile.clearing { animation: tileOut 230ms ease forwards; }

    #hud {
      position: absolute;
      z-index: 10;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(88%, 470px);
      text-align: center;
      pointer-events: none;
    }

    #wordDisplay {
      min-height: 54px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: rgba(0, 0, 0, .72);
      border: 2px solid rgba(246, 210, 10, .9);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .42);
      backdrop-filter: blur(5px);
    }

    .hud-letter {
      min-width: 22px;
      color: #fff;
      font-size: clamp(22px, 3vh, 30px);
      font-weight: 900;
      text-transform: uppercase;
      border-bottom: 3px solid rgba(255,255,255,.5);
      line-height: 1.15;
    }

    .hud-letter.found {
      color: var(--tarantino-yellow);
      border-bottom-color: var(--tarantino-yellow);
      animation: hudPop 160ms ease both;
    }

    #status {
      margin-top: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      text-shadow: 0 2px 4px #000;
    }

    #hint {
      position: absolute;
      z-index: 10;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 13px;
      opacity: .8;
      background: rgba(0, 0, 0, .55);
      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    #message {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--tarantino-yellow);
      font-size: clamp(34px, 6vh, 62px);
      font-weight: 1000;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: 0 5px 0 #000, 0 10px 24px rgba(0,0,0,.65);
      opacity: 0;
      transform: scale(.82);
      pointer-events: none;
    }

    #message.show { animation: messageFlash 620ms ease both; }

    @keyframes tileIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(.25) rotate(-8deg); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
    }

    @keyframes tileOut {
      to { opacity: 0; transform: translate(-50%, -50%) scale(1.35) rotate(6deg); }
    }

    @keyframes wrongTap {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      35% { transform: translate(calc(-50% - 6px), -50%) scale(1.03); }
      70% { transform: translate(calc(-50% + 6px), -50%) scale(1.03); }
    }

    @keyframes hudPop {
      from { transform: scale(.68); }
      to { transform: scale(1); }
    }

    @keyframes messageFlash {
      0% { opacity: 0; transform: scale(.82); }
      25%, 68% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="portraitViewport">
      <video id="roomVideo" src="room.mp4" autoplay muted loop playsinline></video>
      <div id="letterWorld" aria-label="Scattered word letters"></div>

      <div id="hud">
        <div id="wordDisplay" aria-live="polite"></div>
        <div id="status">Loading words…</div>
      </div>

      <div id="message">Found!</div>
      <div id="hint">Drag to look around · Tap letters in order · Backspace to undo</div>
    </div>
  </div>

  <script>
    const WORDS_FILE = "words.txt";
    const FALLBACK_WORDS = ["cinema", "camera", "yellow", "revenge", "dialogue"];

    const viewport = document.getElementById("portraitViewport");
    const video = document.getElementById("roomVideo");
    const letterWorld = document.getElementById("letterWorld");
    const wordDisplay = document.getElementById("wordDisplay");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const body = document.body;

    let words = [];
    let wordIndex = 0;
    let currentWord = "";
    let selectedCount = 0;
    let tiles = [];

    let isDragging = false;
    let movedDuringDrag = false;
    let startX = 0;
    let startOffset = 0;
    let offsetX = 0;
    let minOffset = 0;
    let renderedVideoWidth = 0;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    async function loadWords() {
      try {
        const response = await fetch(WORDS_FILE, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const text = await response.text();
        words = text
          .split(/\r?\n/)
          .map(line => line.trim().toLowerCase())
          .filter(line => line && !line.startsWith("#"))
          .map(line => line.replace(/[^a-z0-9]/g, ""))
          .filter(Boolean);

        if (!words.length) throw new Error("No valid words found");
      } catch (error) {
        console.warn("Could not load words.txt; using built-in sample words.", error);
        words = [...FALLBACK_WORDS];
        status.textContent = "Using built-in words (serve locally to load words.txt)";
      }

      startWord(0);
    }

    function updateLimits() {
      if (!video.videoWidth || !video.videoHeight) return;

      renderedVideoWidth = video.videoWidth * (viewport.clientHeight / video.videoHeight);
      minOffset = Math.min(0, viewport.clientWidth - renderedVideoWidth);
      offsetX = clamp(offsetX, minOffset, 0);

      letterWorld.style.width = `${renderedVideoWidth}px`;
      letterWorld.style.height = `${viewport.clientHeight}px`;
      applyWorldOffset();
    }

    function applyWorldOffset() {
      const transform = `translateX(${offsetX}px)`;
      video.style.transform = transform;
      letterWorld.style.transform = transform;
    }

    function startWord(index) {
      wordIndex = index % words.length;
      currentWord = words[wordIndex];
      selectedCount = 0;
      createHudWord();
      createScatteredLetters();
      status.textContent = `Word ${wordIndex + 1} of ${words.length}`;
    }

    function createHudWord() {
      wordDisplay.replaceChildren();
      [...currentWord].forEach((letter, index) => {
        const slot = document.createElement("span");
        slot.className = "hud-letter";
        slot.dataset.index = index;
        slot.textContent = "·";
        wordDisplay.appendChild(slot);
      });
    }

    function createScatteredLetters() {
      letterWorld.replaceChildren();
      tiles = [];

      const positions = generatePositions(currentWord.length);
      [...currentWord].forEach((letter, index) => {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "letter-tile";
        tile.textContent = letter;
        tile.dataset.index = index;
        tile.setAttribute("aria-label", `Letter ${letter}`);
        tile.style.left = `${positions[index].x}px`;
        tile.style.top = `${positions[index].y}px`;
        tile.style.animationDelay = `${index * 35}ms`;

        tile.addEventListener("pointerdown", event => event.stopPropagation());
        tile.addEventListener("click", event => {
          event.stopPropagation();
          selectLetter(index, tile);
        });

        letterWorld.appendChild(tile);
        tiles.push(tile);
      });
    }

    function generatePositions(count) {
      const width = renderedVideoWidth || Math.max(viewport.clientWidth, 900);
      const height = viewport.clientHeight;
      const marginX = 48;
      const topSafe = Math.max(135, height * .16);
      const bottomSafe = 75;
      const minDistance = Math.max(64, Math.min(92, height * .09));
      const positions = [];

      for (let i = 0; i < count; i++) {
        let candidate;
        let attempts = 0;
        do {
          candidate = {
            x: marginX + Math.random() * Math.max(1, width - marginX * 2),
            y: topSafe + Math.random() * Math.max(1, height - topSafe - bottomSafe)
          };
          attempts++;
        } while (
          attempts < 120 &&
          positions.some(p => Math.hypot(p.x - candidate.x, p.y - candidate.y) < minDistance)
        );
        positions.push(candidate);
      }
      return positions;
    }

    function selectLetter(index, tile) {
      if (index !== selectedCount) {
        tile.classList.remove("wrong");
        void tile.offsetWidth;
        tile.classList.add("wrong");
        return;
      }

      tile.classList.add("selected");
      const hudSlot = wordDisplay.querySelector(`[data-index="${index}"]`);
      hudSlot.textContent = currentWord[index];
      hudSlot.classList.add("found");
      selectedCount++;

      if (selectedCount === currentWord.length) completeWord();
    }

    function undoLastLetter() {
      if (selectedCount <= 0) return;
      selectedCount--;

      const tile = tiles[selectedCount];
      tile.classList.remove("selected");

      const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      hudSlot.textContent = "·";
      hudSlot.classList.remove("found");
    }

    function completeWord() {
      status.textContent = `Completed: ${currentWord.toUpperCase()}`;
      message.classList.remove("show");
      void message.offsetWidth;
      message.classList.add("show");
      tiles.forEach((tile, index) => {
        tile.style.animationDelay = `${index * 18}ms`;
        tile.classList.add("clearing");
      });

      window.setTimeout(() => startWord(wordIndex + 1), 560);
    }

    function pointerDown(event) {
      if (event.button !== undefined && event.button !== 0) return;
      isDragging = true;
      movedDuringDrag = false;
      startX = event.clientX;
      startOffset = offsetX;
      body.classList.add("grabbing");
      viewport.setPointerCapture(event.pointerId);
    }

    function pointerMove(event) {
      if (!isDragging) return;
      const dragDistance = event.clientX - startX;
      if (Math.abs(dragDistance) > 3) movedDuringDrag = true;
      offsetX = clamp(startOffset + dragDistance, minOffset, 0);
      applyWorldOffset();
    }

    function pointerUp(event) {
      isDragging = false;
      body.classList.remove("grabbing");
      try { viewport.releasePointerCapture(event.pointerId); } catch {}
    }

    video.addEventListener("loadedmetadata", () => {
      updateLimits();
      offsetX = minOffset / 2;
      applyWorldOffset();
      if (currentWord) createScatteredLetters();
    });

    window.addEventListener("resize", () => {
      updateLimits();
      if (currentWord) createScatteredLetters();
    });

    window.addEventListener("keydown", event => {
      if (event.key === "Backspace" || event.key === "Back") {
        event.preventDefault();
        undoLastLetter();
      }
    });

    viewport.addEventListener("pointerdown", pointerDown);
    viewport.addEventListener("pointermove", pointerMove);
    viewport.addEventListener("pointerup", pointerUp);
    viewport.addEventListener("pointercancel", pointerUp);

    loadWords();
  </script>
</body>
</html>
