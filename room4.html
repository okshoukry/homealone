<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Room Word Hunt</title>
  <style>
    :root {
      --tarantino-yellow: #f6d20a;
      --letter-beige: #eee3cb;
      --ink: #090909;
      --letter-parallax: .78;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    body { cursor: grab; }
    body.grabbing { cursor: grabbing; }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #portraitViewport {
      position: relative;
      height: 100vh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8);
      isolation: isolate;
    }

    #roomVideo {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #letterWorld {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      transform: translateX(0);
      transform-origin: left top;
      will-change: transform;
    }

    #roomVideo {
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    #letterWorld {
      z-index: 2;
      pointer-events: none;
    }

    .hanging-letter {
      position: absolute;
      top: 0;
      width: clamp(34px, 5.4vh, 52px);
      height: var(--thread-length, 320px);
      transform: translateX(-50%) rotate(var(--sway-start, -2deg));
      transform-origin: 50% 0;
      pointer-events: none;
      animation: pendulumSwing var(--sway-duration, 10s) ease-in-out infinite alternate;
      animation-delay: var(--sway-delay, 0s);
      will-change: transform;
    }

    .hanging-letter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: calc(100% - clamp(34px, 5.4vh, 52px) / 2);
      background: rgba(225, 218, 202, .78);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .letter-tile {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: clamp(34px, 5.4vh, 52px);
      aspect-ratio: 1;
      border: 0;
      border-radius: 2px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: var(--letter-beige);
      font-size: clamp(20px, 3.2vh, 31px);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: none;
      transform: translateX(-50%) scale(1);
      transition:
        transform 220ms cubic-bezier(.2,.8,.2,1),
        opacity 180ms ease,
        background-color 180ms ease;
      animation: tileIn 280ms cubic-bezier(.18,.9,.25,1.2) both;
      will-change: transform;
    }

    .letter-tile:hover,
    .letter-tile:focus-visible {
      transform: translateX(-50%) scale(1.05);
      outline: none;
    }

    .letter-tile.selected {
      pointer-events: none;
    }

    /* A correct tile is yanked upward with its full thread, out of view. */
    .hanging-letter.collected {
      pointer-events: none;
      animation: collectLetter 240ms cubic-bezier(.55, 0, 1, .45) forwards;
    }

    .hanging-letter.collected .letter-tile {
      pointer-events: none;
    }

    .letter-tile.wrong { animation: wrongTap 220ms ease; }
    .letter-tile.clearing { animation: tileOut 230ms ease forwards; }

    #hud {
      position: absolute;
      z-index: 10;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(88%, 470px);
      text-align: center;
      pointer-events: none;
    }

    #wordDisplay {
      min-height: 54px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: rgba(0, 0, 0, .72);
      border: 2px solid rgba(246, 210, 10, .9);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .42);
      backdrop-filter: blur(5px);
    }

    .hud-letter {
      min-width: 22px;
      color: #fff;
      font-size: clamp(22px, 3vh, 30px);
      font-weight: 900;
      text-transform: uppercase;
      border-bottom: 3px solid rgba(255,255,255,.5);
      line-height: 1.15;
    }

    .hud-letter.found {
      color: var(--tarantino-yellow);
      border-bottom-color: var(--tarantino-yellow);
      animation: hudPop 160ms ease both;
    }

    #status {
      margin-top: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      text-shadow: 0 2px 4px #000;
    }

    #hint {
      position: absolute;
      z-index: 10;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 13px;
      opacity: .8;
      background: rgba(0, 0, 0, .55);
      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
    }

    #message {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--tarantino-yellow);
      font-size: clamp(34px, 6vh, 62px);
      font-weight: 1000;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: 0 5px 0 #000, 0 10px 24px rgba(0,0,0,.65);
      opacity: 0;
      transform: scale(.82);
      pointer-events: none;
    }

    #message.show { animation: messageFlash 620ms ease both; }

    @keyframes pendulumSwing {
      from { transform: translateX(-50%) rotate(var(--sway-start, -2deg)); }
      to { transform: translateX(-50%) rotate(var(--sway-end, 2deg)); }
    }

    @keyframes collectLetter {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) rotate(0deg);
      }
      28% {
        transform: translateX(-50%) translateY(-18px) rotate(-1.5deg);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(calc(-1 * var(--thread-length, 320px) - 90px)) rotate(1deg);
      }
    }

    @keyframes tileIn {
      from { opacity: 0; transform: translateX(-50%) scale(.25) rotate(-8deg); }
      to { opacity: 1; transform: translateX(-50%) scale(1) rotate(0); }
    }

    @keyframes tileOut {
      to { opacity: 0; transform: translateX(-50%) scale(1.35) rotate(6deg); }
    }

    @keyframes wrongTap {
      0%, 100% { transform: translateX(-50%) scale(1); }
      35% { transform: translateX(calc(-50% - 6px)) scale(1.03); }
      70% { transform: translateX(calc(-50% + 6px)) scale(1.03); }
    }

    @keyframes hudPop {
      from { transform: scale(.68); }
      to { transform: scale(1); }
    }

    @keyframes messageFlash {
      0% { opacity: 0; transform: scale(.82); }
      25%, 68% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="portraitViewport">
      <video id="roomVideo" src="room.mp4" autoplay muted loop playsinline></video>
      <div id="letterWorld" aria-label="Scattered word letters"></div>

      <div id="hud">
        <div id="wordDisplay" aria-live="polite"></div>
        <div id="status">Loading words…</div>
      </div>

      <div id="message">Found!</div>
      <div id="hint">Drag to look around · Tap letters in order · Backspace to undo</div>
    </div>
  </div>

  <script>
    const WORDS_FILE = "words.txt";
    const FALLBACK_WORDS = ["cinema", "camera", "yellow", "revenge", "dialogue"];

    const viewport = document.getElementById("portraitViewport");
    const video = document.getElementById("roomVideo");
    const letterWorld = document.getElementById("letterWorld");
    const wordDisplay = document.getElementById("wordDisplay");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const body = document.body;

    let words = [];
    let wordIndex = 0;
    let currentWord = "";
    let selectedCount = 0;
    let tiles = [];
    let hangers = [];

    let isDragging = false;
    let movedDuringDrag = false;
    let startX = 0;
    let startOffset = 0;
    let offsetX = 0;
    let minOffset = 0;
    let renderedVideoWidth = 0;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    async function loadWords() {
      try {
        const response = await fetch(WORDS_FILE, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const text = await response.text();
        words = text
          .split(/\r?\n/)
          .map(line => line.trim().toLowerCase())
          .filter(line => line && !line.startsWith("#"))
          .map(line => line.replace(/[^a-z0-9]/g, ""))
          .filter(Boolean);

        if (!words.length) throw new Error("No valid words found");
      } catch (error) {
        console.warn("Could not load words.txt; using built-in sample words.", error);
        words = [...FALLBACK_WORDS];
        status.textContent = "Using built-in words (serve locally to load words.txt)";
      }

      startWord(0);
    }

    function updateLimits() {
      if (!video.videoWidth || !video.videoHeight) return;

      renderedVideoWidth = video.videoWidth * (viewport.clientHeight / video.videoHeight);
      minOffset = Math.min(0, viewport.clientWidth - renderedVideoWidth);
      offsetX = clamp(offsetX, minOffset, 0);

      letterWorld.style.width = `${renderedVideoWidth}px`;
      letterWorld.style.height = `${viewport.clientHeight}px`;
      applyWorldOffset();
    }

    function applyWorldOffset() {
      video.style.transform = `translateX(${offsetX}px)`;

      // The letters occupy the whole panoramic room, but move at a different
      // speed to the video to create a separate foreground parallax layer.
      const parallaxFactor = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--letter-parallax")
      ) || .78;
      letterWorld.style.transform = `translateX(${offsetX * parallaxFactor}px)`;
    }

    function startWord(index) {
      wordIndex = index % words.length;
      currentWord = words[wordIndex];
      selectedCount = 0;
      createHudWord();
      createScatteredLetters();
      status.textContent = `Word ${wordIndex + 1} of ${words.length}`;
    }

    function createHudWord() {
      wordDisplay.replaceChildren();
      [...currentWord].forEach((letter, index) => {
        const slot = document.createElement("span");
        slot.className = "hud-letter";
        slot.dataset.index = index;
        slot.textContent = "·";
        wordDisplay.appendChild(slot);
      });
    }

    function createScatteredLetters() {
      letterWorld.replaceChildren();
      tiles = [];
      hangers = [];

      const positions = generatePositions(currentWord.length);
      [...currentWord].forEach((letter, index) => {
        const hanger = document.createElement("div");
        hanger.className = "hanging-letter";
        hanger.style.left = `${positions[index].x}px`;
        hanger.style.setProperty("--thread-length", `${positions[index].y}px`);
        const swing = 1.4 + Math.random() * 1.5;
        hanger.style.setProperty("--sway-start", `${-swing}deg`);
        hanger.style.setProperty("--sway-end", `${swing}deg`);
        hanger.style.setProperty("--sway-duration", `${9 + Math.random() * 5}s`);
        hanger.style.setProperty("--sway-delay", `${-Math.random() * 10}s`);

        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "letter-tile";
        tile.textContent = letter;
        tile.dataset.index = index;
        tile.setAttribute("aria-label", `Letter ${letter}`);
        tile.style.animationDelay = `${index * 35}ms`;

        tile.addEventListener("pointerdown", event => event.stopPropagation());
        tile.addEventListener("click", event => {
          event.stopPropagation();
          selectLetter(index, tile);
        });

        hanger.appendChild(tile);
        letterWorld.appendChild(hanger);
        tiles.push(tile);
        hangers.push(hanger);
      });
    }

    function generatePositions(count) {
      const viewportWidth = viewport.clientWidth;
      const height = viewport.clientHeight;
      const tileSize = clamp(height * .054, 34, 52);
      const parallaxFactor = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--letter-parallax")
      ) || .78;

      // Because the letter layer pans more slowly than the video, this is the
      // complete horizontal area the player can reveal while dragging from one
      // end of the room to the other.
      const cameraTravel = Math.abs(minOffset);
      const reachableWidth = viewportWidth + cameraTravel * parallaxFactor;

      // Keep each tile fully visible when its section of the room is reached.
      // The extra margin allows for pendulum swing.
      const marginX = Math.max(54, tileSize * 1.35);
      const minX = marginX;
      const maxX = Math.max(minX, reachableWidth - marginX);

      // Every tile must remain entirely within the upper half of the screen.
      // y is the bottom edge of the square because the tile sits at the
      // bottom of its hanging container. A small safety margin also allows
      // for the pendulum arc without crossing the halfway line.
      const topSafe = Math.max(132, height * .17);
      const halfScreenLimit = height * .5;
      const swingSafety = Math.max(14, tileSize * .35);
      const minY = Math.min(halfScreenLimit - swingSafety, topSafe + tileSize);
      const maxY = Math.max(minY, halfScreenLimit - swingSafety);

      // Spread the letters across the entire room panorama. Each letter gets
      // its own broad horizontal region, so some appear only after panning.
      const positions = Array.from({ length: count }, (_, index) => {
        const laneStart = minX + (maxX - minX) * (index / count);
        const laneEnd = minX + (maxX - minX) * ((index + 1) / count);
        const lanePadding = Math.min(22, Math.max(4, (laneEnd - laneStart) * .12));
        const x = count === 1
          ? (minX + maxX) / 2
          : laneStart + lanePadding + Math.random() * Math.max(1, laneEnd - laneStart - lanePadding * 2);

        return {
          x: clamp(x, minX, maxX),
          y: minY + Math.random() * Math.max(1, maxY - minY)
        };
      });

      // Randomise which letter occupies each horizontal section so the answer
      // is not laid out in reading order from left to right.
      for (let i = positions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [positions[i], positions[j]] = [positions[j], positions[i]];
      }

      return positions;
    }

    function selectLetter(index, tile) {
      if (index !== selectedCount) {
        tile.classList.remove("wrong");
        void tile.offsetWidth;
        tile.classList.add("wrong");
        return;
      }

      tile.classList.add("selected");
      const hanger = hangers[index];
      hanger.classList.remove("collected");
      void hanger.offsetWidth;
      hanger.classList.add("collected");

      const hudSlot = wordDisplay.querySelector(`[data-index="${index}"]`);
      hudSlot.textContent = currentWord[index];
      hudSlot.classList.add("found");
      selectedCount++;

      if (selectedCount === currentWord.length) completeWord();
    }

    function undoLastLetter() {
      if (selectedCount <= 0) return;
      selectedCount--;

      const tile = tiles[selectedCount];
      const hanger = hangers[selectedCount];
      hanger.classList.remove("collected");
      tile.classList.remove("selected");

      const hudSlot = wordDisplay.querySelector(`[data-index="${selectedCount}"]`);
      hudSlot.textContent = "·";
      hudSlot.classList.remove("found");
    }

    function completeWord() {
      status.textContent = `Completed: ${currentWord.toUpperCase()}`;
      message.classList.remove("show");
      void message.offsetWidth;
      message.classList.add("show");
      tiles.forEach((tile, index) => {
        if (!hangers[index].classList.contains("collected")) {
          tile.style.animationDelay = `${index * 18}ms`;
          tile.classList.add("clearing");
        }
      });

      window.setTimeout(() => startWord(wordIndex + 1), 560);
    }

    function pointerDown(event) {
      if (event.button !== undefined && event.button !== 0) return;
      isDragging = true;
      movedDuringDrag = false;
      startX = event.clientX;
      startOffset = offsetX;
      body.classList.add("grabbing");
      viewport.setPointerCapture(event.pointerId);
    }

    function pointerMove(event) {
      if (!isDragging) return;
      const dragDistance = event.clientX - startX;
      if (Math.abs(dragDistance) > 3) movedDuringDrag = true;
      offsetX = clamp(startOffset + dragDistance, minOffset, 0);
      applyWorldOffset();
    }

    function pointerUp(event) {
      isDragging = false;
      body.classList.remove("grabbing");
      try { viewport.releasePointerCapture(event.pointerId); } catch {}
    }

    video.addEventListener("loadedmetadata", () => {
      updateLimits();
      offsetX = minOffset / 2;
      applyWorldOffset();
      if (currentWord) createScatteredLetters();
    });

    window.addEventListener("resize", () => {
      updateLimits();
      if (currentWord) createScatteredLetters();
    });

    window.addEventListener("keydown", event => {
      if (event.key === "Backspace" || event.key === "Back") {
        event.preventDefault();
        undoLastLetter();
      }
    });

    viewport.addEventListener("pointerdown", pointerDown);
    viewport.addEventListener("pointermove", pointerMove);
    viewport.addEventListener("pointerup", pointerUp);
    viewport.addEventListener("pointercancel", pointerUp);

    loadWords();
  </script>
</body>
</html>
